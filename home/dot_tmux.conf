# Managed by chezmoi (VoidUnderflow/dotfiles).

# Neovim compatibility: true color, undercurl, instant Esc, focus events.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle"
set -sg escape-time 10
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy to the system clipboard via OSC 52.
set -s set-clipboard on

# vi copy mode: v selects, y copies, Ctrl+V toggles block selection.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# New panes and windows open in the current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-style "bg=default,fg=blue"
set -g status-left "#[fg=green,bold] #S "
set -g status-left-length 20
set -g status-right "#[fg=cyan]%H:%M "
setw -g window-status-current-style "fg=magenta,bold"

# Ctrl+H/J/K/L move between tmux panes and Neovim splits.
run-shell ~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux
# The navigator takes Ctrl+L, so prefix + Ctrl+L clears the screen.
bind C-l send-keys C-l
