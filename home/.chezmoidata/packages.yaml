# brews: CLI tools on every Mac and Linux machine.
# personalBrews: CLI tools on personal Mac and Linux machines only.
# casks: GUI apps, Mac only.
# scoop: Windows apps.
packages:
  brews:
    - fd
    - fzf
    - lazygit
    - neovim
    - ripgrep
    - starship
    - tmux
    - tree-sitter-cli
    - zsh-autosuggestions
    - zsh-syntax-highlighting
  personalBrews:
    - mise
    - uv
  casks:
    - font-jetbrains-mono-nerd-font
    - ghostty
  scoopBuckets:
    - nerd-fonts
  scoop:
    - JetBrainsMono-NF-Mono
